# Build the Jaspr site and deploy it to GitHub Pages from main.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deploy at a time, in push order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Activate jaspr CLI
        run: dart pub global activate jaspr_cli 0.24.0-beta.1
      - run: dart pub get
      - run: dart analyze
      - name: Build the static site
        run: jaspr build --sitemap-domain https://opensource.weirdbrains.com
      - name: Check the build
        run: |
          test -f build/jaspr/index.html
          grep -q 'href="https://weirdbrains.com"' build/jaspr/index.html
          grep -q 'A Weird Brains project' build/jaspr/index.html
          for slug in $(python3 -c 'import json;print(*[p["slug"] for p in json.load(open("data/projects.json"))])'); do
            test -f "build/jaspr/images/projects/$slug.webp" || { echo "missing screenshot $slug"; exit 1; }
          done
          printf 'opensource.weirdbrains.com\n' > build/jaspr/CNAME
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
